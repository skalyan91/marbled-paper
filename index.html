<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Marbled paper</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1614; overflow: hidden; overscroll-behavior: none; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; }
      #err { position: fixed; left: 0; bottom: 24px; width: min(60vw, 700px); max-height: 40vh; overflow: auto;
             background: #300; color: #fdd; font: 12px/1.4 ui-monospace, monospace;
             white-space: pre-wrap; padding: 8px; display: none; z-index: 10; }
      #hud { position: fixed; left: 8px; bottom: 6px; color: #eee; font: 12px ui-monospace, monospace;
             text-shadow: 0 0 3px #000; opacity: .75; pointer-events: none; }
      .lil-gui { --width: 300px; }
      .lil-gui select, .lil-gui option { font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .marble-dropdown { position: fixed; z-index: 5000; max-height: 60vh; overflow-y: auto; background: #1f1f1f; color: #ebebeb;
        border: 1px solid #424242; border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.5); padding: 3px 0;
        font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .marble-dropdown .item { padding: 5px 10px; white-space: nowrap; cursor: pointer; }
      .marble-dropdown .item:hover { background: #2c2c2c; }
      .marble-dropdown .item.selected { color: #2cc9ff; }
      @media (pointer: coarse) { .marble-dropdown .item { padding: 9px 12px; font-size: 14px; } }
      /* phones: the panel becomes a sheet along the bottom, closed by default; the HUD moves to the top */
      @media (max-width: 640px) {
        .lil-gui.autoPlace { --width: 100vw; top: auto; bottom: 0; right: 0; left: 0; max-height: 60vh; max-height: 60dvh;
          padding-bottom: env(safe-area-inset-bottom); }
        .lil-gui.autoPlace > .title { font-size: 14px; }
        #hud { top: max(6px, env(safe-area-inset-top)); bottom: auto; right: 8px; font-size: 10px; white-space: normal; }
        #err { bottom: auto; top: 40px; width: calc(100vw - 16px); }
        .marble-dropdown { left: 8px !important; right: 8px; min-width: 0 !important; max-height: 50vh; max-height: 50dvh; }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <pre id="err"></pre>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
